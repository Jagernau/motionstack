name: Build MotionStack APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'studio.js'
      - 'autosegment.js'
      - 'tests/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax before packaging
        run: python3 tests/check_js.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle MagicTouch model into APK (offline)
        run: |
          mkdir -p android/app/src/main/assets
          curl --fail --location --retry 3 --retry-delay 3 --show-error             'https://storage.googleapis.com/mediapipe-models/interactive_segmenter_v2/magic_touch/int8/latest/interactive_segmentation.task'             --output android/app/src/main/assets/interactive_segmentation.task
          test -s android/app/src/main/assets/interactive_segmentation.task
          ls -lh android/app/src/main/assets/interactive_segmentation.task
      - name: Copy offline Studio into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp studio.js android/app/src/main/assets/studio.js
      - name: Assemble Android debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug
      - name: Verify APK contains offline editor and model
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/index.html'
          unzip -l "$APK" | grep -F 'assets/studio.js'
          unzip -l "$APK" | grep -F 'assets/interactive_segmentation.task'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionStack-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: Publish direct APK download
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download compiled APK
        uses: actions/download-artifact@v4
        with:
          name: MotionStack-debug-APK
          path: release
      - name: Prepare APK filename
        run: |
          test -s release/app-debug.apk
          mv release/app-debug.apk release/MotionStack-v0.3.0-debug.apk
          ls -lh release/MotionStack-v0.3.0-debug.apk
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release upload v0.3.0 release/MotionStack-v0.3.0-debug.apk --clobber
          else
            gh release create v0.3.0 release/MotionStack-v0.3.0-debug.apk \
              --target "$GITHUB_SHA" \
              --title "MotionStack v0.3.0 — Android beta" \
              --prerelease \
              --notes "Debug APK for Android. Includes offline MagicTouch tap-to-segment, automatic frame masks, and full-frame cutouts. Experimental: test with your own video. To replace an existing debug install signed with another key, uninstall the old version first."
          fi
