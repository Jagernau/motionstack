plugins { id 'com.android.application' }

android {
    namespace 'dev.motionstack.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.motionstack.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.3.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // MagicTouch is bundled in the APK; no Google Play download at runtime.
    implementation 'com.google.mediapipe:tasks-vision:1.2.2'
}
